        const fileToDataURL = (file, maxSize = 800, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            let w = img.width, h = img.height;
                            if (w > maxSize || h > maxSize) {
                                if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
                                else { w = Math.round(w * maxSize / h); h = maxSize; }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch (err) { reject(err); }
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

            if (!history || history.length === 0) return 0;
            const uniqueDates = [...new Set(history.map(h => new Date(h.date).toDateString()))]

                .sort((a, b) => b - a);
            if (uniqueDates.length === 0) return 0;
            const today = new Date(); today.setHours(0,0,0,0);
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const mostRecent = uniqueDates[0];
            if (mostRecent.getTime() !== today.getTime() && mostRecent.getTime() !== yesterday.getTime()) return 0;
            let streak = 1, prev = mostRecent;
            for (let i = 1; i < uniqueDates.length; i++) {
                if ((prev.getTime() - uniqueDates[i].getTime()) / (86400000) === 1) { streak++; prev = uniqueDates[i]; }
                else break;
            }
            return streak;
